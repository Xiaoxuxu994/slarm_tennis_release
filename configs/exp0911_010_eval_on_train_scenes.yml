# 评测口径不变，只把场景集合换成**训练集**。用来回答一个问题：
#
#     像素路径也有 4 倍的训练/验证差距吗？
#
# 为什么需要这一跑。exp0911_010 冻结 exp0908_003/ckpt_007999，而 0908_003 正是在
# scene_list/ball_catch_triview_0903_2k_train.txt 上训练的，所以那 1800 个场景是
# 模型真正见过的。它的训练日志给出了 ball token 的物理量纲误差：
#
#     stream25_ball_vel_l2_ms   0.0257 m/s      （训练场景，均值）
#     验证评测 balltoken vel15   0.101  m/s      （验证场景，中位数）
#                                                 差 3.9 倍
#
# 但训练日志里**没有**像素路径的 m/s 口径误差 —— ms3_ball_raw 是 v/5.0、a/9.81、
# j/1.0 三项归一化后混在一起的 smooth_l1，换不回物理单位。所以像素路径的泛化能力
# 至今未知，而它恰好是下一轮实验要走的那条路。
#
# 方法。只改 eval_annotation。走的仍然是 Stream25EvalDataset（全 25 个 target、
# 三目取最差、跨场景中位数），和验证评测逐字节同口径，唯一的差别是场景集合。
# 不要用 --split train：那会走 Stream25Dataset(training=True)，只出 7 个
# scheduler target，和验证不可比，而且会触发 target 数量断言。
#
# 场景数也对齐。验证集 200 个场景，训练集 1800 个。中位数对样本量不敏感但 p95 敏感，
# 而且 1800 个场景要跑 9 倍时间。所以取训练 manifest 的前 200 个：
#
#     head -n 200 data/slarm_data/scene_list/ball_catch_triview_0903_2k_train.txt \
#       > data/slarm_data/scene_list/ball_catch_triview_0903_2k_train_first200.txt
#
# 怎么读结果。和验证那张表逐行对照，重点是这两行：
#
#     ball velocity med      像素路径（MS3 头）    验证 0.099
#     balltoken vel15        ball token           验证 0.101
#
#   像素路径 ≈ 0.10（无差距）
#       泛化问题是 ball token 独有的。它是 1536 维 token 上的小 MLP，1800 场景 ×
#       3 个速度标量，背下来很容易；像素路径读的是渲染出来的几何，记忆自由度小得多。
#       -> 砍掉 ball token，全力走像素/几何路线。
#
#   像素路径 ≈ 0.026（同样 4 倍）
#       泛化是系统性的，换读出方式救不了。瓶颈是每个场景的监督标量太少
#       （速度 3 个 vs 重建 10^6 量级，而重建的验证指标全部达标）。
#       -> 别再调架构，去加场景数。
#
# ball token 那两行会顺带复现 0.026，可以当这一跑的自检：如果它没落在 0.026
# 附近，说明训练日志和评测的口径不同，整个对比作废。
#
# 这里不改任何权重、损失或架构，load_from 和 010 完全一致 —— 它只是同一份权重
# 换一批场景再测一次。
