# Pixel/MS3-only continuation on new data; no ball-token or residual modules.
# Assumes the same resolution, camera names, time and coordinate contract as 0903_2k.
# See docs/PIXEL_10K_FINETUNE.md before creating manifests or starting training.
model: slarm
dataset: [ball_catch_triview_0908_10k]
data_root: data/slarm_data
input_size: [320, 240]
patch_size: 8
embed_dim: 768
depth: 12
patch_embed: conv
num_max_cameras: 3
num_context_timesteps: 6
num_target_timesteps: 7
context_stride: 3
timespan: 0.8
mode: window_6
stream25_catch_frame: 45
stream25_ball_radius: 0.0325
use_affine_token: true
use_sky_token: true
use_ms3_motion: true
use_last_token: true
shortcut_rgb: true
add_patch_plucker_embed: true
sigmoid_rgb: true
num_motion_tokens: 0
strict_data_loading: true
enable_task_semantic_head: true
terminal_context_extrapolation: true
stream25_render_target_chunk_size: 7
stream25_reconstruction_loss: true

# Preserve the original pixel-path supervision and MS3 physical scales.
stream25_rgb_weight: 1
stream25_lpips_weight: 0.05
stream25_ball_rgb_weight: 0.5
stream25_depth_relative_weight: 1
stream25_ball_depth_metric_weight: 0.5
stream25_semantic_weight: 1
stream25_ms3_ball_weight: 1
stream25_ms3_static_weight: 0.25
stream25_opacity_weight: 0.1
stream25_ms3_velocity_scale: 5
stream25_ms3_acceleration_scale: 9.81
stream25_ms3_jerk_scale: 1
terminal_dynamic_velocity_threshold: 1
stream25_semantic_class_weight_cap: 10
online_feat: false
enable_feat_loss: false
feat_loss_coeff: 0
stream25_lseg_feature_weight: 0
enable_depth_loss: true
enable_sky_opacity_loss: true
enable_perceptual_loss: true
perceptual_weight: 0.05
perceptual_loss_start_iter: 0
load_depth: true

# Four GPUs, global batch 4. Train both trunk and pixel heads; pixel-only does
# NOT mean frozen trunk.
#
# Epochs = num_iterations * global_batch / training scenes, so 20000 steps is
# 8 epochs over 10k scenes and 4 over 20k. Do NOT apply the exp0908_001 rule
# (num_iterations = 40 * scenes / 4): at this scale it asks for 200k steps,
# about 113 hours at the measured 2.04 s/step. More data should buy sample
# diversity, not more passes over the same scenes -- the whole point is that
# the ball trajectory is what gets memorised.
#
# ---- LR: raised from 2e-5/2e-6 after measuring the zero-shot gap ----
#
# The 0903_2k pixel checkpoint evaluated on this dataset without training:
#
#                       aggregate  front_left  front_right  lower_front
#   ball IoU farthest      0.1732      0.2680       0.2831       0.0000
#   ball depth med far     0.0594      0.0517       0.0496       2.8646
#   RGB PSNR anchor       29.1352     29.8275      29.9366      27.6749
#   depth absrel far       0.1009      0.0432       0.0435       0.2159
#
# Two things, not one. In lower_front the ball is not merely worse, it is
# absent: IoU exactly zero at the extrapolated frames, and a 2.86 m depth
# error on ball pixels is the background behind the ball, i.e. no ball
# Gaussian is rendered there at all. The catch ring is hollow in this data, so
# that camera now sees through it and the ball with it; a model trained where
# a net blocked that view in most scenes never had to put anything there.
# But lower_front also loses 2.2 dB of RGB and five times the depth error, so
# this is not only a ball problem -- the whole view changed.
#
# And the front pair regressed on their own: ball IoU at the far frames falls
# from 0.63 to 0.27. The old 0.63 was effectively the front pair alone, since
# an occluded lower_front has an empty GT ball mask and drops out of the
# average rather than scoring zero.
#
# That is the size of an adaptation, not a continuation. exp0908_001 crossed a
# comparable gap (simulator backgrounds to room Gaussian renders) at 7e-5 with
# a 1000-step warmup. 2e-5 is 3.5x below that and risks spending 11 hours
# under-fitting a view that currently renders no ball. 5e-5 keeps some of the
# damping that 11x more data makes affordable without giving up the adaptation.
#
# If the first 2000 steps show RGB or depth degrading rather than recovering,
# that is the signal to come back down, and the 2000-step checkpoints make it
# visible without waiting for the end.
lr: 0.00005
stream25_trunk_lr: 0.000005
lr_sched: cosine
min_lr: 1.0e-7
warmup_iters: 1000
batch_size: 1
seed: 20260915
# load_from 的根目录是 work_dirs/，不是新的 output/。这不是笔误：输出根目录这次
# 从 work_dirs/slarm/ 改成了 output/，而已经训好的权重仍在原处，没有搬动。
# exp_name 没变，所以两条路径只差一个根：
#   work_dirs/slarm/<exp_name>/checkpoints/   已有权重
#   output/<exp_name>/checkpoints/            新训练写这里
# 想统一的话把旧目录搬过去即可：mv work_dirs/slarm/<exp_name> output/
load_from: work_dirs/slarm/exp0908_001_slarm_stream25_0903_2k_triview_window6_nolseg_4gpu/checkpoints/ckpt_019999.pth
train_annotation: scene_list/ball_catch_triview_0908_10k_train.txt
eval_annotation: scene_list/ball_catch_triview_0908_10k_validation.txt
num_iterations: 20000
ckpt_every_n_iters: 2000
vis_every_n_iters: 2000
num_vis_samples: 2
eval_every_n_iters: 50000
keep_n_ckpts: 10
project: slarm
exp_name: exp0915_001_slarm_stream25_0908_10k_pixel_finetune
